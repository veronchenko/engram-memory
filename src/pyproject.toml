[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engram"
version = "0.13.0"
description = "Engram — persistent knowledge base MCP server"
requires-python = ">=3.12"
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "agent-memory",
    "llm-memory",
    "ai-agents",
    "rag",
    "hybrid-search",
    "semantic-search",
    "knowledge-base",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
engram = "cli:main"

[tool.setuptools]
py-modules = [
    "server",
    "config",
    "database",
    "doctor",
    "port_utils",
    "schema",
    "search_backend",
    "team_admin",
    "cli",
]
packages = ["dashboard", "admin_api"]
