[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engram"
version = "0.13.0"
description = "Engram — persistent knowledge base MCP server"
requires-python = ">=3.12"
dependencies = [
    "fastmcp==3.4.5",
    "pyyaml==6.0.2",
    "model2vec==0.8.2",
    "numpy==2.2.6",
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "jinja2==3.1.5",
    "itsdangerous==2.2.0",
]
keywords = [
    "mcp",
    "mcp-server",
    "model-context-protocol",
    "agent-memory",
    "llm-memory",
    "ai-agents",
    "rag",
    "hybrid-search",
    "semantic-search",
    "knowledge-base",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
engram = "cli:main"

[tool.uv]
default-groups = ["dev", "test"]

[dependency-groups]
dev = [
    "ruff==0.16.1",
    "mypy==2.3.0",
    "types-PyYAML==6.0.12.20260724",
    "pre-commit==4.6.1",
]
test = [
    "pytest==8.4.2",
    "httpx==0.28.1",
]

[tool.setuptools]
py-modules = [
    "server",
    "config",
    "database",
    "doctor",
    "port_utils",
    "schema",
    "search_backend",
    "team_admin",
    "cli",
]
packages = ["dashboard", "admin_api"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting + import line length via E501)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["server", "config", "database", "doctor", "port_utils", "schema", "search_backend", "team_admin", "cli", "dashboard", "admin_api"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
show_error_codes = true
