[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "engram"
version = "0.12.1"
description = "Engram — persistent knowledge base MCP server"
requires-python = ">=3.12"

[project.scripts]
engram = "cli:main"

[tool.setuptools]
py-modules = [
    "server",
    "config",
    "database",
    "doctor",
    "port_utils",
    "schema",
    "search_backend",
    "team_admin",
    "cli",
]
packages = ["dashboard", "admin_api"]
